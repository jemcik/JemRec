# What the New issue page offers: a problem gets the form (bug.yml), which asks
# for Copy a report; a question or an idea goes to Discussions. Blank issues are
# off, so a report always comes through the form; maintainers still see a
# blank issue, marked Maintainers only.
# A security problem needs no link here: with SECURITY.md in the repository
# GitHub adds its own "Report a security vulnerability" entry, pointing to it
# (seen on nodejs/node's page, 2026-10-31). Before SECURITY.md this page had no
# such entry, so this file carried one of its own.
blank_issues_enabled: false
contact_links:
  - name: Ask a question
    url: https://github.com/jemcik/JemRec/discussions/categories/q-a
    about: Setting it up, how something works, whether it works on your phone.
  - name: Suggest an idea
    url: https://github.com/jemcik/JemRec/discussions/categories/ideas
    about: Something JemRec could do. If it is there already, upvote it.
