# What the New issue page offers besides a blank issue: a question or an idea
# goes to Discussions and a security problem to a private report, so issues
# stay for what is broken. Blank issues stay on: there are no issue templates,
# so a blank one is how a problem is reported. The security link is ours:
# private reporting is on, but GitHub put no link to it on this page (seen
# 2026-10-31, with no SECURITY.md). It leads nowhere without that setting:
# if private reporting is ever turned off, take the link out with it.
blank_issues_enabled: true
contact_links:
  - name: Ask a question
    url: https://github.com/jemcik/JemRec/discussions/categories/q-a
    about: Setting it up, how something works, whether it works on your phone.
  - name: Suggest an idea
    url: https://github.com/jemcik/JemRec/discussions/categories/ideas
    about: Something JemRec could do. If it is there already, upvote it.
  - name: Report a security problem
    url: https://github.com/jemcik/JemRec/security/advisories/new
    about: Privately, so it is not public before a fix ships.
