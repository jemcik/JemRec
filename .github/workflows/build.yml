# Everything the pre-push hook checks, plus the APK, on every branch and PR.
#
# THE SDK LIST IS LONGER THAN A NORMAL ANDROID PROJECT'S, and the extra entries
# are load-bearing. The shell-side capture daemon is not a Gradle module: it is
# compiled by shellserver/build.sh against the platform the DEVICE runs, with
# its @hide framework internals intact, and dexed with d8 by hand. Gradle runs
# that script as part of preBuild, so a runner without android-36 and
# build-tools 36.0.0 fails before the app is compiled at all - not at the end,
# where it would be obvious.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      # AGP 9 numbers the newest platform with a minor version, so compileSdk 37
      # is "platforms;android-37.0" and NOT "platforms;android-37" - which is
      # what the first run here failed on: "Failed to find package". Older
      # platforms keep their plain names, so the daemon's android-36 is asked
      # for both ways and whichever exists wins. The check afterwards is the
      # part that matters: build.sh reads android.jar and d8 by path, and a
      # missing one fails deep inside a Gradle task rather than here.
      - name: Install the SDK the app and the daemon need
        run: |
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"
          sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-36.0"
          sdkmanager --install "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" \
            || { echo "::error::android-36/android.jar is missing; shellserver/build.sh cannot compile the daemon"; ls "$ANDROID_HOME/platforms"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/36.0.0/d8" \
            || { echo "::error::build-tools 36.0.0 d8 is missing"; ls "$ANDROID_HOME/build-tools"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jemrec-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
