# Attaches a signed APK to a GitHub Release, whether the release was made by
# pushing a version tag or by pressing "Create a new release" in the web UI.
#
# Releases exist here because workflow ARTIFACTS require a signed-in GitHub
# account to download, while release assets do not - so this is the one that
# gives anybody a link they can tap on a phone. There is no Play listing and
# there will not be one: Play forbade call recorders in 2022.
#
# THE KEY IS THE WHOLE POINT. An APK signed by a different certificate cannot
# install over an earlier one, whatever its version number - so a release built
# with the runner's throwaway debug key would strand every person who installed
# it. Four secrets are required, and the job fails loudly rather than falling
# back to anything:
#   JEMREC_KEYSTORE_BASE64    the .jks, base64-encoded
#   JEMREC_KEYSTORE_PASSWORD
#   JEMREC_KEY_ALIAS
#   JEMREC_KEY_PASSWORD
# The keystore itself never enters the repo - see .gitignore, which has refused
# signing material since before any existed.
name: release

on:
  push:
    # Both styles. The convention here is a bare "0.2", but a "v0.2" that
    # silently did nothing would be a worse outcome than accepting both.
    tags: ['v[0-9]*', '[0-9]*']
  release:
    types: [published]

# Creating a release from the web UI fires BOTH of the above - it pushes the tag
# and publishes the release - so two runs can start for the same tag. Queue them
# instead of cancelling; the publish step is idempotent either way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 21, and exactly 21, because the daemon's bytecode depends on the javac
      # major that compiled it - see shellserver/build.sh, which refuses any
      # other. F-Droid's build server is Debian trixie with default-jdk, which
      # is 21; a release built with a different major cannot be reproduced
      # there, and F-Droid would have to sign it with its own key instead.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      # AGP 9 numbers the newest platform with a minor version, so compileSdk 37
      # is "platforms;android-37.0" and NOT "platforms;android-37" - which is
      # what the first run here failed on: "Failed to find package". Older
      # platforms keep their plain names, so the daemon's android-36 is asked
      # for both ways and whichever exists wins. The check afterwards is the
      # part that matters: build.sh reads android.jar and d8 by path, and a
      # missing one fails deep inside a Gradle task rather than here.
      - name: Install the SDK the app and the daemon need
        run: |
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"
          sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-36.0"
          sdkmanager --install "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" \
            || { echo "::error::android-36/android.jar is missing; shellserver/build.sh cannot compile the daemon"; ls "$ANDROID_HOME/platforms"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/36.0.0/d8" \
            || { echo "::error::build-tools 36.0.0 d8 is missing"; ls "$ANDROID_HOME/build-tools"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      # The version is READ from gradle.properties and CHECKED against the tag,
      # not derived from the tag. gradle.properties is what F-Droid's update
      # checker reads at each tag, so it has to be right in the commit the tag
      # points at - and a tag that disagrees with it means the bump was
      # forgotten, which is the moment to stop, not to paper over. The
      # versionCode formula is enforced here for the same reason: it is what
      # keeps installs upgradeable, so a hand-typed code that breaks it must
      # not reach a release.
      - name: Check the tag against gradle.properties
        # Explicitly bash: this reads BASH_REMATCH, which zsh does not set, so
        # the same lines silently compare against versionCode 0 there.
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "::error::Tag '$TAG' is not MAJOR.MINOR[.PATCH]. Tag as 0.2, v0.2, 0.2.1 or v0.2.1."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[4]:-0}"
          EXPECTED_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          NAME=$(sed -n 's/^jemrecVersionName=//p' gradle.properties)
          CODE=$(sed -n 's/^jemrecVersionCode=//p' gradle.properties)
          if [ "$NAME" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' but gradle.properties says jemrecVersionName=$NAME. Bump gradle.properties, commit, and tag that commit."
            exit 1
          fi
          if [ "$CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::gradle.properties says jemrecVersionCode=$CODE but $VERSION is MAJOR*10000 + MINOR*100 + PATCH = $EXPECTED_CODE."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "$TAG -> versionName $VERSION, versionCode $CODE, as gradle.properties says"

      # Written to RUNNER_TEMP, not the workspace, so it cannot be picked up by
      # anything that archives the checkout.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JEMREC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::JEMREC_KEYSTORE_BASE64 is not set. Releases must be signed with a stable key or they cannot be installed over the previous version. See the header of this workflow."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jemrec.jks"
          echo "JEMREC_KEYSTORE=$RUNNER_TEMP/jemrec.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          JEMREC_KEYSTORE_PASSWORD: ${{ secrets.JEMREC_KEYSTORE_PASSWORD }}
          JEMREC_KEY_ALIAS: ${{ secrets.JEMREC_KEY_ALIAS }}
          JEMREC_KEY_PASSWORD: ${{ secrets.JEMREC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # The gate. app/build.gradle.kts deliberately leaves the APK UNSIGNED
      # rather than falling back to a debug key, and AGP names an unsigned build
      # app-release-unsigned.apk - so a missing or wrong secret stops the release
      # here instead of publishing something nobody can upgrade to. The
      # certificate digest is printed so a change of signing identity is visible
      # in the log rather than discovered on a phone.
      - name: Refuse to publish an APK that is not signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK is missing. AGP writes app-release-unsigned.apk when no signing config is attached, so the keystore did not reach the build."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      # Named from VERSION rather than the raw tag, so "0.2" and "v0.2" produce
      # the same asset name.
      - name: Name it after the version
        run: |
          mkdir -p dist
          cp "$APK" "dist/jemrec-${VERSION}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # The release may already exist - the normal case when it was made
          # with the web UI's "Create a new release" button - which is why this
          # creates only when missing rather than unconditionally.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "Requires Android 12 (API 31) or newer. Signed with the project release key, so it installs over any earlier release of the same lineage."
          gh release upload "$TAG" dist/*.apk --clobber
