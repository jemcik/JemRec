# Every Robolectric test: Android's rule for folder grants (PickerGrants).
shadows=com.jemcik.jemrec.recordings.PickerGrants
# Every Robolectric test runs under the plain Application, not JemRecApp.
# JemRecApp starts a thread at each start of the app - in Robolectric, each
# test - that nothing waits for, and it outlived its test. Its look for the
# app's files folder (ShareCopies.sweep) could come after Robolectric reset
# that folder and before the next test's own temp folder was set, so the next
# test got the ended test's folder, with that test's files in it: main's
# build failed twice in a row on 2026-11-19, after 1.2 put the sweep there
# (TrashPlacesTest "Is a directory", RecentlyDeletedTest more than one in the
# trash). With that thread slowed 50 ms, as on a busy runner, 3 of the 502
# recordings tests failed so on the Mac; under the plain Application, none
# (2026-11-20). The app's code does not depend on its Application's class; a
# test of what the app does at its start calls that work itself.
application=android.app.Application
