org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# THE VERSION LIVES HERE, and nowhere else.
#
# Gradle hands every key in this file to findProperty(), so app/build.gradle.kts
# reads these two without knowing where they came from. They are here rather
# than in the build script because F-Droid's update checker reads the version
# out of a file at each tag with a regex, and cannot evaluate the Kotlin that
# would otherwise compute it. A release is a pull request that bumps these,
# merged to main: the release workflow tags that merge itself, and refuses a
# tag pushed by hand that is not on main or does not match them.
#
# jemrecVersionCode is MAJOR*10000 + MINOR*100 + PATCH: 0.2 -> 200, 1.0 -> 10000.
# Android refuses to install an APK whose versionCode is not higher than the
# installed one, and this keeps it monotonic with room to spare.
jemrecVersionName=0.21
jemrecVersionCode=2100
